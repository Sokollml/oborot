[project]
name = "oborot-backend"
version = "0.1.0"
description = "Оборот — API и воркер кредитного конвейера"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "bcrypt>=5.0.0",
    "fastapi>=0.157.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.5",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
# Это приложение, а не библиотека: собирать пакет не нужно.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    # TestClient Starlette переходит на httpx2 — это предупреждение библиотеки, не нашего кода
    "ignore::DeprecationWarning:fastapi.testclient",
    "ignore:Using `httpx` with `starlette.testclient`",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
# Ошибки (E/F), порядок импортов (I), упрощения (SIM), современный синтаксис (UP), частые баги (B)
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # длинные строки с русскими текстами для людей не режем

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]  # переменные окружения задаются до импорта app.*

[tool.ruff.lint.flake8-bugbear]
# Form(...), File(...) и т.п. в значениях по умолчанию — обычный приём FastAPI, а не ошибка
extend-immutable-calls = ["fastapi.Form", "fastapi.File", "fastapi.Query", "fastapi.Header", "fastapi.Depends"]

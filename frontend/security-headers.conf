# Защитные заголовки для всех ответов (подключаются в каждый location в nginx.conf).
add_header X-Content-Type-Options "nosniff" always;                 # браузер не «угадывает» тип файла
add_header X-Frame-Options "DENY" always;                           # кабинет нельзя встроить в чужой сайт
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# Исходный протокол: если перед nginx стоит туннель или балансировщик с https, он присылает
# X-Forwarded-Proto — передаём его дальше (API ставит cookie с флагом Secure). Иначе — свой $scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Документы до 10 МБ + запас на заголовки multipart.
    client_max_body_size 11m;

    # Сжатие: JS и CSS уходят в браузер в 3–4 раза меньше.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Защитные заголовки. В nginx заголовки из server не наследуются в location, где есть свои add_header,
    # поэтому общий набор подключён в каждый location через include.

    # Все запросы /api/... уходят в контейнер api без изменения пути.
    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Файлы сборки с хешем в имени не меняются — браузер может хранить их год.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Одностраничное приложение: любой неизвестный путь отдаёт index.html,
    # дальше маршрут разбирает React Router. Сам index.html не кешируем — иначе не увидеть новую версию.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        # Страница загружает скрипты, стили и шрифты только со своего адреса; встраивать её в чужие сайты нельзя.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}

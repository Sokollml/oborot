# Запуск всего проекта: docker compose up
# Точка входа для пользователя — http://localhost:3000
# Все переменные имеют значения по умолчанию, поэтому .env не обязателен
# (но его удобно создать из .env.example, чтобы что-то поменять).

name: stupeni

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-stupeni}:${POSTGRES_PASSWORD:-stupeni}@db:5432/${POSTGRES_DB:-stupeni}
  MOCK_EXTERNAL_URL: http://mock-external:8001
  JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
  DEMO_MODE: ${DEMO_MODE:-true}
  DEMO_PASSWORD: ${DEMO_PASSWORD:-demo12345}
  STAGE_DELAY_SECONDS: ${STAGE_DELAY_SECONDS:-2}
  WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-1}
  EXTERNAL_TIMEOUT_SECONDS: ${EXTERNAL_TIMEOUT_SECONDS:-3}
  EXTERNAL_RETRIES: ${EXTERNAL_RETRIES:-3}
  EXTERNAL_RETRY_PAUSE_SECONDS: ${EXTERNAL_RETRY_PAUSE_SECONDS:-1}
  UPLOAD_DIR: /data/uploads

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stupeni}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stupeni}
      POSTGRES_DB: ${POSTGRES_DB:-stupeni}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    image: stupeni-backend:dev
    environment: *backend-env
    ports:
      - "8000:8000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Тот же образ, что и у api, — другая команда запуска.
  worker:
    build: ./backend
    image: stupeni-backend:dev
    command: ["python", "-m", "app.worker"]
    environment: *backend-env
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy # api при старте применяет миграции — ждём его
      mock-external:
        condition: service_healthy
    restart: unless-stopped

  mock-external:
    build: ./mock-external
    environment:
      MOCK_DELAY_SECONDS: ${MOCK_DELAY_SECONDS:-0.3}
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  uploads:

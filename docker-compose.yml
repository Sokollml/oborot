# Запуск всего проекта: docker compose up
# Точка входа для пользователя — http://localhost:3000 (порт меняется в .env: APP_PORT)
# Все переменные имеют значения по умолчанию, поэтому .env не обязателен
# (но его удобно создать из .env.example, чтобы что-то поменять).

name: oborot

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-oborot}:${POSTGRES_PASSWORD:-oborot}@db:5432/${POSTGRES_DB:-oborot}
  MOCK_EXTERNAL_URL: http://mock-external:8001
  JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789abcdef}
  DEMO_MODE: ${DEMO_MODE:-true}
  DEMO_PASSWORD: ${DEMO_PASSWORD:-demo12345}
  STAGE_DELAY_SECONDS: ${STAGE_DELAY_SECONDS:-2}
  WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-1}
  JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-30}
  EXTERNAL_TIMEOUT_SECONDS: ${EXTERNAL_TIMEOUT_SECONDS:-3}
  EXTERNAL_RETRIES: ${EXTERNAL_RETRIES:-3}
  EXTERNAL_RETRY_PAUSE_SECONDS: ${EXTERNAL_RETRY_PAUSE_SECONDS:-1}
  UPLOAD_DIR: /data/uploads

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oborot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oborot}
      POSTGRES_DB: ${POSTGRES_DB:-oborot}
    ports:
      # Для тестов бэкенда с хоста (uv run pytest). Только для этого компьютера, не для локальной сети.
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    image: oborot-backend:dev
    environment: *backend-env
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000" # Swagger для разработчиков
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      mock-external:
        condition: service_healthy # seed при первом запуске берёт данные компаний из «реестра»
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Тот же образ, что и у api, — другая команда запуска.
  worker:
    build: ./backend
    image: oborot-backend:dev
    command: ["python", "-m", "app.worker"]
    environment: *backend-env
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy # api при старте применяет миграции — ждём его
      mock-external:
        condition: service_healthy
    restart: unless-stopped

  mock-external:
    build: ./mock-external
    environment:
      MOCK_DELAY_SECONDS: ${MOCK_DELAY_SECONDS:-0.3}
    ports:
      - "127.0.0.1:${MOCK_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20

  frontend:
    build: ./frontend
    ports:
      - "${APP_PORT:-3000}:80" # кабинет; доступен и с телефона в той же сети
    depends_on:
      api:
        condition: service_healthy

  # Публичная ссылка на демо через Cloudflare Quick Tunnel (бесплатно, без аккаунта).
  # Не запускается по умолчанию — только явно:
  #   docker compose --profile tunnel up -d tunnel
  #   docker compose logs tunnel | grep trycloudflare.com
  # Адрес меняется при каждом перезапуске туннеля.
  # Сеть хоста — чтобы туннель ходил в интернет тем же путём, что и сама машина (VPN/прокси);
  # протокол http2 (TCP) — надёжнее QUIC (UDP) за прокси и корпоративными сетями.
  tunnel:
    image: cloudflare/cloudflared:2026.9.3
    profiles: ["tunnel"]
    network_mode: host
    command: ["tunnel", "--no-autoupdate", "--protocol", "http2", "--url", "http://localhost:${APP_PORT:-3000}"]
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
